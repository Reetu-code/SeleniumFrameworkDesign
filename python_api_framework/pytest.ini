[pytest]
minversion = 8.0
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

addopts =
    -v
    --tb=short
    --html=reports/report.html
    --self-contained-html
    --log-cli-level=INFO

markers =
    smoke: Smoke tests for critical API functionality
    regression: Regression test suite
    user: Tests related to User API management
    auth: Tests related to Auth API

log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)s] %(message)s (%(filename)s:%(lineno)s)
log_cli_date_format = %Y-%m-%d %H:%M:%S
